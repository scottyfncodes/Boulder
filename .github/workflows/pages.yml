# Builds the game and publishes it to GitHub Pages.
#
# This runs as soon as Pages is switched on for the repo with its source set to
# "GitHub Actions" (Settings -> Pages -> Source). Until then the workflow is
# inert — it will queue and fail at the deploy step with a message saying Pages
# is not enabled, which is expected rather than broken.
#
# Note that Pages on a private repository needs a paid plan; on the free plan
# the repository has to be public first.
name: Deploy to Pages

on:
  push:
    branches: [main, 'claude/bouldering-puzzle-game-c770xg']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do let a newer commit cancel a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
