<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Bernie, hanging off a V0 jug. Full-bleed square: iOS and Android apply
       their own corner mask, so the artwork keeps inside the central 80%. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="85%">
      <stop offset="0" stop-color="#23382f"/>
      <stop offset="0.6" stop-color="#171a21"/>
    </radialGradient>
    <radialGradient id="hold" cx="40%" cy="32%" r="70%">
      <stop offset="0" stop-color="#7fe6b9"/>
      <stop offset="1" stop-color="#3fae80"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(-22 -6) scale(1.08)">
  <!-- the arm, up to the hold -->
  <path d="M300 300 L350 104" stroke="#e0b48f" stroke-width="40" stroke-linecap="round"/>
  <!-- the hold -->
  <ellipse cx="356" cy="132" rx="74" ry="58" fill="url(#hold)"/>
  <!-- the hand, fingers curled over the lip -->
  <path d="M318 96 C318 76 382 76 382 96 L382 112 C382 122 318 122 318 112 Z" fill="#e0b48f"/>
  <path d="M334 100 V116 M350 100 V118 M366 100 V116" stroke="#c9976f" stroke-width="4" stroke-linecap="round"/>
  <!-- teal jacket shoulders -->
  <path d="M110 512 C110 400 170 362 250 362 C330 362 392 400 392 512 Z" fill="#2fa9a5"/>
  <path d="M222 366 L250 420 L278 366 Z" fill="#f2efe6"/>
  <!-- head -->
  <circle cx="240" cy="282" r="100" fill="#e0b48f"/>
  <!-- hair -->
  <path d="M142 268 C140 196 196 172 244 174 C300 176 342 206 338 262 C312 232 268 222 230 226 C196 230 164 246 142 268 Z" fill="#3a2a20"/>
  <!-- sunglasses -->
  <rect x="150" y="262" width="184" height="16" rx="6" fill="#0d0f14"/>
  <rect x="160" y="264" width="72" height="48" rx="10" fill="#0d0f14"/>
  <rect x="254" y="264" width="72" height="48" rx="10" fill="#0d0f14"/>
  <rect x="172" y="272" width="22" height="8" rx="3" fill="#ffffff" opacity="0.35"/>
  <rect x="266" y="272" width="22" height="8" rx="3" fill="#ffffff" opacity="0.35"/>
  <!-- moustache and a small smile -->
  <path d="M196 338 C212 322 232 322 242 332 C252 322 272 322 288 338 C268 346 252 344 242 338 C232 344 216 346 196 338 Z" fill="#3a2a20"/>
  <path d="M220 354 Q242 368 264 354" stroke="#8a4a3a" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
